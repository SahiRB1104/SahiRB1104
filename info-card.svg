<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 315" width="540" height="315">
<style>

        .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
        .header-dot { rx: 50%; ry: 50%; }
        .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
        .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #8b949e; font-weight: 600; }
        .val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 500; }
        .prompt-symbol { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #7ee787; font-weight: 700; }
        .line { opacity: 0; animation: lineFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes lineFadeIn {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
    
  .line-0 { animation-delay: 0.1s; }
  .line-1 { animation-delay: 0.18s; }
  .line-2 { animation-delay: 0.26s; }
  .line-3 { animation-delay: 0.34s; }
  .line-4 { animation-delay: 0.42s; }
  .line-5 { animation-delay: 0.5s; }
  .line-6 { animation-delay: 0.58s; }
  .line-7 { animation-delay: 0.66s; }
  .line-8 { animation-delay: 0.74s; }
  .line-9 { animation-delay: 0.82s; }
</style>
<rect class="bg" width="540" height="315" />
<circle class="header-dot" cx="20" cy="18" r="5" fill="#ff5f56" />
