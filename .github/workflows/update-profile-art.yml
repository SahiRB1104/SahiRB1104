name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Latest Contributions Data
        run: python scripts/fetch_contributions.py

      - name: Render Contribution Heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Auto-commit Fresh Contribution SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(art): auto-refresh GitHub contribution heatmap SVG [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
